# VirtualSMS: Account Verification for OpenAI Codex CLI
#
# VirtualSMS is an account verification platform for developers and AI agents.
# It combines one-time SMS verification, dedicated number rentals, matching-country
# proxies and private cloud browser sessions behind one API, one MCP server and
# one prepaid balance.
#
# Drop this into ~/.codex/config.toml (or %USERPROFILE%\.codex\config.toml on
# Windows) so the Codex CLI can call VirtualSMS MCP tools when you ask it to
# verify accounts, receive SMS codes, rent numbers, or buy proxies.
#
# Get your API key (free, no card) at https://virtualsms.io
# Per-client setup matrix:                https://virtualsms.io/mcp
# Parent MCP server repo:                 https://github.com/virtualsms-io/mcp-server

[mcp_servers.virtualsms]
command = "npx"
args    = ["virtualsms-mcp"]
env     = { VIRTUALSMS_API_KEY = "vsms_your_key_here" }

# What you get with this config:
#
#   40 MCP tools: discovery (no auth), account, orders, rentals, proxies and browser sessions.
#   Carrier-issued mobile numbers, backed by real physical SIM cards on operators
#   like Vodafone, O2 and T-Mobile, not VoIP, across 2500+ services and 145+ countries.
#
# Capabilities:
#
#   Receive one-time SMS codes from $0.05
#   Rent dedicated numbers from 1 to 30 days
#   Buy matching-country residential, mobile and datacenter proxies
#   Launch private cloud browser sessions that work alongside your number and proxy (beta)
#
# Order-flow tool quick-reference (see mcp.virtualsms.io for the full 40-tool list):
#
#   Discovery (no auth)
#     list_services       - full service catalog
#     list_countries      - 145+ countries
#     get_price            - price for a service x country pair
#     find_cheapest        - lowest-price country for a service, right now
#     search_services      - natural-language match ("telega" -> Telegram)
#
#   Account (auth)
#     get_balance, get_profile, get_stats, get_transactions
#
#   Order management (auth)
#     create_order(service, country)  - purchase a number, returns order_id
#     wait_for_sms(order_id)          - WebSocket wait, returns instantly
#     get_sms(order_id)               - poll for SMS (use for cron / batch)
#     get_order(order_id)             - full detail + all SMS received
#     cancel_order(order_id)          - cancel + refund if no SMS yet
#     cancel_all_orders()             - bulk cancel
#     list_orders()                   - currently-active activations
#     order_history(...)              - past orders with filters
#     swap_number(order_id)           - exchange number, no extra charge
#
# Recommended flow:
#   1. find_cheapest(service)            -> pick country
#   2. create_order(service, country)    -> number + order_id
#   3. <Codex agent triggers verification on the target service>
#   4. wait_for_sms(order_id)            -> return code to caller
#   5. on failure: swap_number(order_id) or cancel_order(order_id)
